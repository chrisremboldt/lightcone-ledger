name: Image
# Builds infra/Dockerfile for linux/amd64 and linux/arm64 and publishes it to the GitHub Container Registry, at
# ghcr.io/<owner>/<repository> in lower case. A published release publishes it tagged with the release's tag, and as
# latest unless the release is a pre-release. Run by hand, it builds both platforms and publishes nothing unless the
# publish input is set; then it is tagged sha-<commit> only.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the image (tagged sha-<commit>, never latest)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04
    # The arm64 half is built under emulation, which is several times slower than the native half.
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'release' || inputs.publish == true }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Name the image after the repository, in lower case
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=sha,format=short,enable=${{ github.event_name == 'workflow_dispatch' }}
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Write the image digest to the job summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            if [ "$PUBLISH" = 'true' ]; then
              echo "## Published ${IMAGE}"
              echo
              echo "Digest: \`${DIGEST}\`"
              echo
              echo "Pull it by digest: \`docker pull ${IMAGE}@${DIGEST}\`"
              echo
              echo 'Tags:'
              echo
              printf '%s\n' "$TAGS" | sed 's/^/- `/; s/$/`/'
            else
              echo "## Built ${IMAGE} for linux/amd64 and linux/arm64, not published"
              echo
              echo "Digest of this build: \`${DIGEST:-none reported}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
